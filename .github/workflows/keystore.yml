name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Keystore and Base64
        run: |
          keytool -genkey -v \
            -keystore release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias recomp \
            -storepass "AgendaNeverDies" \
            -keypass "AgendaNeverDies" \
            -dname "CN=Dev, OU=Dev, O=Dev, L=City, S=State, C=US"
          base64 -w 0 release.jks > keystore_b64.txt

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            release.jks
            keystore_b64.txt
          retention-days: 1